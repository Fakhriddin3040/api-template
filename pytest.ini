[pytest]
minversion = 8.0
addopts = -q -ra --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests.
    integration: Integration tests (need a database).
    domain: Domain-layer tests.
    application: Application-layer tests.
    infra: Infrastructure tests.
    shared_kernel: Shared-kernel tests.
log_cli = true
log_cli_level = INFO
pythonpath = .
