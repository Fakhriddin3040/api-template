services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    volumes:
      - .:/code
      - media:/code/media
      # Shared with the telemetry service: the daemon tails what the API writes.
      - logs:/code/logs
    ports:
      - "${SERVER_PORT:-8000}:8000"

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      SERVICE_NAME: telemetry
    volumes:
      - .:/code
      - logs:/code/logs

  nginx:
    volumes:
      - ./nginx/${NGINX_CONF:-default.conf}:/etc/nginx/conf.d/default.conf:ro
      - media:/code/media:ro
    ports:
      - "${PROXY_INTERNAL_PORT:-80}:80"

  db:
    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
