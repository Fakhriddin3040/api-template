# In-network coordinates are set here, not in .env: inside the compose network
# every service is reachable at its standard port, so POSTGRES_HOST/PORT and
# REDIS_HOST/PORT are overridden for the containers. The values in .env describe
# the *host* side — where each service is published and how you reach it from
# your machine.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEMETRY_SERVICE: api
    volumes:
      - .:/code
      - media:/code/media
      # Shared with the telemetry service: the daemon tails what the API writes.
      - logs:/code/logs
    ports:
      - "${APP_PORT:-8000}:8000"

  telemetry:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      TELEMETRY_SERVICE: telemetry
    volumes:
      - .:/code
      - logs:/code/logs

  nginx:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/code/media:ro
    ports:
      - "${NGINX_PORT:-80}:80"

  db:
    env_file: [.env]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
